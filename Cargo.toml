[workspace]
resolver = "2"
members = [
    "crates/api-server",
    "crates/arb-monitor",
    "crates/auth",
    "crates/backtester",
    "crates/bot-scanner",
    "crates/polymarket-core",
    "crates/risk-manager",
    "crates/trading-engine",
    "crates/wallet-tracker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Anthony Limo"]
license = "MIT"
repository = "https://github.com/anthonylimo/ab-bot"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Types
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"

# Concurrent data structures
dashmap = "5.5"

# Encoding
hex = "0.4"
base64 = "0.22"

# URL parsing
url = "2.5"

# Encryption
aes-gcm = "0.10"

# Async traits
async-trait = "0.1"

# Ethereum signing and transactions (for Polymarket CLOB)
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy-signer = "0.6"
alloy-signer-local = "0.6"
alloy-consensus = "0.6"
alloy-network = "0.6"

# HMAC for L2 authentication
hmac = "0.12"

# Internal crates
polymarket-core = { path = "crates/polymarket-core" }
trading-engine = { path = "crates/trading-engine" }
risk-manager = { path = "crates/risk-manager" }
auth = { path = "crates/auth" }
wallet-tracker = { path = "crates/wallet-tracker" }
backtester = { path = "crates/backtester" }

# CLI
clap = { version = "4", features = ["derive"] }

# Memory allocator — jemalloc reduces fragmentation under Tokio async workloads
tikv-jemallocator = "0.6"
