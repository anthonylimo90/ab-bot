name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Path Filtering
  # ==========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the defaults: checkout needs contents.
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'migrations/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'dashboard/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  # ==========================================================================
  # Rust Backend
  # ==========================================================================
  rust-format:
    name: Rust Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-ci"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-test:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-ci"

      - name: Run tests
        run: cargo test --workspace --locked

  rust-migrations:
    name: Migrations (TimescaleDB)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # The production database image: every migration must apply on it
        # through sqlx, in order, inside its transactions.
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rust-ci"

      - name: Apply the complete schema
        run: cargo test -p api-server --lib --locked migration_tests::complete_schema -- --ignored

  rust-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Dashboard (Next.js)
  # ==========================================================================
  dashboard-check:
    name: Dashboard Lint & TypeCheck
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Browser intent regression tests
        run: npm run test:unit

      - name: Type check
        run: npx tsc --noEmit

  dashboard-build:
    name: Dashboard Build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  # ==========================================================================
  # Docker Build
  # ==========================================================================
  docker-build:
    name: Docker Build (${{ matrix.dockerfile }})
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every image Railway deploys (see railway/).
        dockerfile: [Dockerfile, Dockerfile.arb-monitor, Dockerfile.dashboard]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  # ==========================================================================
  # All Checks Pass
  # ==========================================================================
  ci-success:
    name: CI Success
    needs:
      - changes
      - rust-format
      - rust-clippy
      - rust-test
      - rust-migrations
      - rust-audit
      - dashboard-check
      - dashboard-build
      - docker-build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          # If change detection fails every job is skipped; that is a failure.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed (got: ${{ needs.changes.result }})"
            exit 1
          fi
          results=(
            "${{ needs.rust-format.result }}"
            "${{ needs.rust-clippy.result }}"
            "${{ needs.rust-test.result }}"
            "${{ needs.rust-migrations.result }}"
            "${{ needs.rust-audit.result }}"
            "${{ needs.dashboard-check.result }}"
            "${{ needs.dashboard-build.result }}"
            "${{ needs.docker-build.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more jobs failed (got: $result)"
              exit 1
            fi
          done
          echo "All CI checks passed!"
