# Railway config for the arb-monitor service. Set the service's Railway
# Config File to /railway/arb-monitor.toml (an absolute path).
# Schema: https://railway.com/railway.schema.json

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.arb-monitor"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
drainingSeconds = 30

[deploy.limitOverride.containers]
memoryBytes = 2147483648
