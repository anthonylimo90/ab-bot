services:
  # ===========================================================================
  # Database Services
  # ===========================================================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ab-bot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abbot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ab_bot}
    # Reachable from this machine only; containers use the internal network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    # The schema is applied by the API server's versioned migrations, never by
    # init scripts: those run once, on an empty volume, and skip every later
    # migration silently.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abbot} -d ${POSTGRES_DB:-ab_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab-bot-network

  redis:
    image: redis:7-alpine
    container_name: ab-bot-redis
    environment:
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:-app_secret_change_me}
      REDIS_DYNAMIC_TUNER_PASSWORD: ${REDIS_DYNAMIC_TUNER_PASSWORD:-dynamic_tuner_secret_change_me}
      REDIS_DYNAMIC_SUBSCRIBER_PASSWORD: ${REDIS_DYNAMIC_SUBSCRIBER_PASSWORD:-dynamic_subscriber_secret_change_me}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis-entrypoint.sh:/usr/local/etc/redis/redis-entrypoint.sh:ro
    command: sh /usr/local/etc/redis/redis-entrypoint.sh
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user app --pass ${REDIS_APP_PASSWORD:-app_secret_change_me} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ab-bot-network

  # ===========================================================================
  # Application Services
  # ===========================================================================
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab-bot-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-abbot}:${POSTGRES_PASSWORD:-abbot_secret}@postgres:5432/${POSTGRES_DB:-ab_bot}
      REDIS_URL: redis://app:${REDIS_APP_PASSWORD:-app_secret_change_me}@redis:6379
      DYNAMIC_TUNER_REDIS_URL: redis://dynamic_tuner:${REDIS_DYNAMIC_TUNER_PASSWORD:-dynamic_tuner_secret_change_me}@redis:6379
      DYNAMIC_CONFIG_REDIS_URL: redis://dynamic_subscriber:${REDIS_DYNAMIC_SUBSCRIBER_PASSWORD:-dynamic_subscriber_secret_change_me}@redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # JWT_SECRET is required - generate with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a secure value (min 32 chars)}
      CORS_PERMISSIVE: ${CORS_PERMISSIVE:-true}
      # Exact origins allowed to call the API (comma-separated); empty allows all.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Wallet sign-in (SIWE) is bound to the dashboard's domain and URI; outside
      # development it is disabled until both are set.
      APP_DOMAIN: ${APP_DOMAIN:-}
      APP_URI: ${APP_URI:-}
      # This file publishes the API port directly, so no proxy's X-Forwarded-For
      # is trusted. Set it to the number of reverse proxies when behind them.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      RUST_LOG: ${RUST_LOG:-api_server=info,tower_http=info}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      ARB_AUTO_EXECUTE: ${ARB_AUTO_EXECUTE:-false}
      ARB_POSITION_SIZE: ${ARB_POSITION_SIZE:-50}
      ARB_MIN_NET_PROFIT: ${ARB_MIN_NET_PROFIT:-0.001}
      ARB_MIN_BOOK_DEPTH: ${ARB_MIN_BOOK_DEPTH:-100}
      LIVE_TRADING: ${LIVE_TRADING:-false}
      EXECUTOR_MIN_BOOK_DEPTH: ${EXECUTOR_MIN_BOOK_DEPTH:-100}
      DYNAMIC_TUNER_BOOTSTRAP_ENABLED: ${DYNAMIC_TUNER_BOOTSTRAP_ENABLED:-true}
      DYNAMIC_TUNER_BOOTSTRAP_MAX_ATTEMPTS: ${DYNAMIC_TUNER_BOOTSTRAP_MAX_ATTEMPTS:-100}
      DYNAMIC_TUNER_NO_TRADE_WINDOW_MINUTES: ${DYNAMIC_TUNER_NO_TRADE_WINDOW_MINUTES:-120}
      DYNAMIC_TUNER_NO_TRADE_MIN_ATTEMPTS: ${DYNAMIC_TUNER_NO_TRADE_MIN_ATTEMPTS:-20}
      # Enables GET /metrics for this bearer token (16+ characters); the
      # monitoring profile's Prometheus scrapes with it.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "${API_PORT:-3000}:3000"
    # Room for open requests (15s) and, alongside them, started trading
    # operations (40s) to finish.
    stop_grace_period: 50s
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Migrations run before the server listens; dependants wait on this.
      start_period: 120s
    networks:
      - ab-bot-network
    restart: unless-stopped

  arb-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab-bot-arb-monitor
    environment:
      SERVICE: arb-monitor
      DATABASE_URL: postgres://${POSTGRES_USER:-abbot}:${POSTGRES_PASSWORD:-abbot_secret}@postgres:5432/${POSTGRES_DB:-ab_bot}
      REDIS_URL: redis://app:${REDIS_APP_PASSWORD:-app_secret_change_me}@redis:6379
      DYNAMIC_CONFIG_REDIS_URL: redis://dynamic_subscriber:${REDIS_DYNAMIC_SUBSCRIBER_PASSWORD:-dynamic_subscriber_secret_change_me}@redis:6379
      RUST_LOG: ${RUST_LOG:-arb_monitor=info}
    depends_on:
      # The API server applies the schema this service reads.
      api-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ab-bot-network
    restart: unless-stopped

  bot-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ab-bot-scanner
    environment:
      SERVICE: bot-scanner
      DATABASE_URL: postgres://${POSTGRES_USER:-abbot}:${POSTGRES_PASSWORD:-abbot_secret}@postgres:5432/${POSTGRES_DB:-ab_bot}
      RUST_LOG: ${RUST_LOG:-bot_scanner=info}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
    depends_on:
      # The API server applies the schema this service writes.
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ab-bot-network
    restart: unless-stopped
    profiles:
      - full  # Only run with --profile full

  # ===========================================================================
  # Monitoring Services (optional)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ab-bot-prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Prometheus reads the API's bearer token from a file, kept in its data
    # directory (the one place its unprivileged user may write).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$METRICS_TOKEN" > /prometheus/.metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --web.enable-lifecycle
    networks:
      - ab-bot-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ab-bot-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: false
      # The PostgreSQL datasource uses the database's own credentials.
      POSTGRES_USER: ${POSTGRES_USER:-abbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abbot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ab_bot}
    # Never start with Grafana's default admin password.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ] || [ "$$GF_SECURITY_ADMIN_PASSWORD" = admin ];
        then echo 'Set GRAFANA_PASSWORD to start Grafana' >&2; exit 1; fi;
        exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ab-bot-network
    profiles:
      - monitoring

# ===========================================================================
# Networks & Volumes
# ===========================================================================
networks:
  ab-bot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
