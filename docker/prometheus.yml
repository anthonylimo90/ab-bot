global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The API's trading metrics (circuit breaker, worker heartbeats, positions,
  # unresolved orders and withdrawals). Needs METRICS_TOKEN set for both the
  # API and this container; the entrypoint writes it to the file below.
  - job_name: 'api-server'
    metrics_path: '/metrics'
    authorization:
      type: Bearer
      credentials_file: /prometheus/.metrics_token
    static_configs:
      - targets: ['api-server:3000']
